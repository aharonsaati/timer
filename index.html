<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>נגן אימון אישי</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --text-muted: #8b949e;
      --action-color: #f0883e;
      --rest-color: #58a6ff;
      --accent: #238636;
      --danger: #da3633;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      text-align: center;
    }

    .phase-badge {
      display: inline-block;
      padding: 0.35rem 1rem;
      border-radius: 999px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 0.5rem;
    }

    .phase-intro { background: rgba(187, 128, 255, 0.15); color: #d2a8ff; border: 1px solid #d2a8ff; }
    .phase-action { background: rgba(240, 136, 62, 0.15); color: var(--action-color); border: 1px solid var(--action-color); }
    .phase-rest { background: rgba(88, 166, 255, 0.15); color: var(--rest-color); border: 1px solid var(--rest-color); }
    .phase-ready { background: rgba(139, 148, 158, 0.15); color: var(--text-muted); border: 1px solid var(--border); }

    .timer-display {
      font-size: 4.5rem;
      font-weight: 800;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
      margin: 0.5rem 0;
    }

    .total-time {
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .instruction-box {
      font-size: 1.15rem;
      line-height: 1.5;
      min-height: 4.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.5rem;
    }

    .meta-details {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      text-align: right;
      font-size: 0.9rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      padding-top: 0.75rem;
      margin-top: 0.5rem;
    }

    .meta-details strong { color: var(--text); }

    .voice-control-box {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.75rem;
      align-items: center;
    }

    select {
      flex: 1;
      background: #090d13;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: #c9d1d9;
      padding: 0.6rem;
      font-size: 0.85rem;
      outline: none;
    }

    .btn-test {
      background: #1f6feb;
      color: #fff;
      padding: 0.6rem 0.9rem;
      font-size: 0.85rem;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      white-space: nowrap;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }

    button {
      padding: 0.9rem 1rem;
      border: none;
      border-radius: 8px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: opacity 0.2s;
    }

    button:active { opacity: 0.8; }
    .btn-start { background-color: var(--accent); color: #fff; grid-column: span 2; }
    .btn-pause { background-color: #d29922; color: #111; }
    .btn-reset { background-color: var(--danger); color: #fff; }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <div id="phaseBadge" class="phase-badge phase-ready">מוכן להתחלה</div>
    <div id="phaseTimer" class="timer-display">00</div>
    <div class="total-time">זמן כולל שנותר: <span id="totalTimer">00:00</span></div>
    
    <div id="instructionText" class="instruction-box">
      לחץ על "התחל אימון" לתחילת התרגול
    </div>

    <div class="meta-details">
      <div><strong>אזור מגע:</strong> <span id="areaDisplay">-</span></div>
      <div><strong>קצב והנחיה:</strong> <span id="paceDisplay">-</span></div>
    </div>

    <div class="voice-control-box">
      <select id="voiceSelect" aria-label="בחירת קול"></select>
      <button id="testVoiceBtn" class="btn-test">בדוק קול</button>
    </div>
  </div>

  <div class="controls">
    <button id="startBtn" class="btn-start">התחל אימון</button>
    <button id="pauseBtn" class="btn-pause" style="display:none;">השהה</button>
    <button id="resetBtn" class="btn-reset" style="display:none;">איפוס</button>
  </div>
</div>

<script>
  let config = {};
  let timerInterval = null;
  let isRunning = false;
  let currentPhase = 'ready';
  let phaseTimeLeft = 0;
  let totalTimeLeft = 0;
  let wakeLock = null;
  let availableVoices = [];

  const phaseBadge = document.getElementById('phaseBadge');
  const phaseTimer = document.getElementById('phaseTimer');
  const totalTimer = document.getElementById('totalTimer');
  const instructionText = document.getElementById('instructionText');
  const areaDisplay = document.getElementById('areaDisplay');
  const paceDisplay = document.getElementById('paceDisplay');
  const startBtn = document.getElementById('startBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const resetBtn = document.getElementById('resetBtn');
  const voiceSelect = document.getElementById('voiceSelect');
  const testVoiceBtn = document.getElementById('testVoiceBtn');

  function decodeBase64Utf8(str) {
    try {
      str = str.replace(/-/g, '+').replace(/_/g, '/');
      while (str.length % 4) str += '=';
      const binary = atob(str);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return new TextDecoder().decode(bytes);
    } catch (e) {
      return null;
    }
  }

  function parsePayload() {
    let rawQuery = window.location.search;
    if (!rawQuery && window.location.hash.includes('?')) {
      rawQuery = window.location.hash.substring(window.location.hash.indexOf('?'));
    }
    const p = new URLSearchParams(rawQuery);

    let data = null;

    // 1. קריאת JSON מלא מתוך Base64
    if (p.get('b64')) {
      const decoded = decodeBase64Utf8(p.get('b64'));
      if (decoded) {
        try { data = JSON.parse(decoded); } catch (e) {}
      }
    }

    // 2. קריאת JSON ישיר (אם נשלח מקודד רגיל)
    if (!data && p.get('data')) {
      try { data = JSON.parse(decodeURIComponent(p.get('data'))); } catch (e) {}
    }

    // 3. תמיכה ב-Hash ישיר
    if (!data) {
      const hash = window.location.hash.replace(/^#/, '');
      if (hash.startsWith('{')) {
        try { data = JSON.parse(decodeURIComponent(hash)); } catch (e) {}
      }
    }

    // מיפוי הנתונים שהתקבלו מבחוץ (כולל תמיכה במפתחות מקוצרים לקיצור ה-URL)
    config = {
      durationMin: parseInt((data && (data.durationMin || data.m)) || p.get('m') || '3', 10),
      actionDurationSec: parseInt((data && (data.actionSec || data.a)) || p.get('a') || '10', 10),
      restDurationSec: parseInt((data && (data.restSec || data.r)) || p.get('r') || '20', 10),
      areaText: (data && (data.areaText || data.area)) || p.get('area') || "בהתאם להנחיות",
      paceText: (data && (data.paceText || data.pace)) || p.get('pace') || "קצב מבוקר",
      introMsg: (data && (data.introMsg || data.im)) || p.get('im') || "תדריך אימון. התמקם בנוח. מתחילים.",
      introVoice: (data && (data.introVoice || data.iv)) || p.get('iv') || "תַּדְרִיךְ אִמּוּן. הִתְמַקֵּם בְּנוֹחַ. מַתְחִילִים.",
      actionMsg: (data && (data.actionMsg || data.am)) || p.get('am') || "שלב פעולה.",
      actionVoice: (data && (data.actionVoice || data.av)) || p.get('av') || "שְׁלַב פְּעֻלָּה.",
      restMsg: (data && (data.restMsg || data.rm)) || p.get('rm') || "שלב עצירה והרפיה.",
      restVoice: (data && (data.restVoice || data.rv)) || p.get('rv') || "שְׁלַב עֲצִירָה וְהַרְפָּיָה.",
      endMsg: (data && (data.endMsg || data.em)) || p.get('em') || "האימון הסתיים בהצלחה.",
      endVoice: (data && (data.endVoice || data.ev)) || p.get('ev') || "הָאִמּוּן הִסְתַּיֵּם בְּהַצְלָחָה."
    };
  }

  function populateVoices() {
    if (!('speechSynthesis' in window)) return;
    availableVoices = window.speechSynthesis.getVoices();
    voiceSelect.innerHTML = '';

    const hebrewVoices = availableVoices.filter(v => v.lang.startsWith('he'));
    const voicesToShow = hebrewVoices.length > 0 ? hebrewVoices : availableVoices;

    voicesToShow.forEach((v) => {
      const opt = document.createElement('option');
      opt.value = v.name;
      opt.textContent = `${v.name} (${v.lang})`;
      voiceSelect.appendChild(opt);
    });

    const preferred = voicesToShow.find(v => 
      v.name.includes('Carmit') || 
      v.name.includes('Hila') || 
      v.name.toLowerCase().includes('female') ||
      v.name.includes('2')
    );
    if (preferred) voiceSelect.value = preferred.name;
  }

  if ('speechSynthesis' in window) {
    populateVoices();
    window.speechSynthesis.onvoiceschanged = populateVoices;
  }

  function speak(text, onEndCallback = null) {
    if (!text || !('speechSynthesis' in window)) {
      if (onEndCallback) onEndCallback();
      return;
    }
    window.speechSynthesis.cancel();
    
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'he-IL';
    utterance.rate = 0.9;
    utterance.pitch = 1.25;

    const chosenVoice = availableVoices.find(v => v.name === voiceSelect.value);
    if (chosenVoice) utterance.voice = chosenVoice;

    if (onEndCallback) {
      utterance.onend = onEndCallback;
      utterance.onerror = onEndCallback;
    }
    window.speechSynthesis.speak(utterance);
  }

  testVoiceBtn.addEventListener('click', () => {
    speak(config.introVoice || "בדיקת שמע.");
  });

  function initFromConfig() {
    parsePayload();
    totalTimeLeft = config.durationMin * 60;
    phaseTimeLeft = config.actionDurationSec;
    areaDisplay.textContent = config.areaText;
    paceDisplay.textContent = config.paceText;
    instructionText.textContent = config.introMsg;
    totalTimer.textContent = formatTime(totalTimeLeft);
    phaseTimer.textContent = String(config.actionDurationSec).padStart(2, '0');
  }

  function formatTime(seconds) {
    const mins = Math.floor(seconds / 60);
    const secs = seconds % 60;
    return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
  }

  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
    } catch (e) {}
  }

  function releaseWakeLock() {
    if (wakeLock) {
      wakeLock.release();
      wakeLock = null;
    }
  }

  function switchPhase(newPhase) {
    currentPhase = newPhase;
    if (newPhase === 'action') {
      phaseTimeLeft = config.actionDurationSec;
      phaseBadge.textContent = "פעולה";
      phaseBadge.className = "phase-badge phase-action";
      instructionText.textContent = config.actionMsg;
      speak(config.actionVoice);
    } else if (newPhase === 'rest') {
      phaseTimeLeft = config.restDurationSec;
      phaseBadge.textContent = "עצירה והרפיה";
      phaseBadge.className = "phase-badge phase-rest";
      instructionText.textContent = config.restMsg;
      speak(config.restVoice);
    }
    phaseTimer.textContent = String(phaseTimeLeft).padStart(2, '0');
  }

  function tick() {
    if (totalTimeLeft <= 0) {
      endSession();
      return;
    }

    totalTimeLeft--;
    phaseTimeLeft--;
    totalTimer.textContent = formatTime(totalTimeLeft);
    phaseTimer.textContent = String(phaseTimeLeft).padStart(2, '0');

    if (phaseTimeLeft <= 0) {
      switchPhase(currentPhase === 'action' ? 'rest' : 'action');
    }
  }

  function startTimer() {
    if (isRunning) return;
    isRunning = true;
    requestWakeLock();

    startBtn.style.display = 'none';
    pauseBtn.style.display = 'block';
    resetBtn.style.display = 'block';

    if (currentPhase === 'ready') {
      phaseBadge.textContent = "תדריך הנחיות";
      phaseBadge.className = "phase-badge phase-intro";
      instructionText.textContent = config.introMsg;

      speak(config.introVoice, () => {
        if (!isRunning) return;
        switchPhase('action');
        timerInterval = setInterval(tick, 1000);
      });
    } else {
      timerInterval = setInterval(tick, 1000);
    }
  }

  function pauseTimer() {
    if (!isRunning) return;
    isRunning = false;
    clearInterval(timerInterval);
    releaseWakeLock();
    window.speechSynthesis.cancel();

    startBtn.style.display = 'block';
    startBtn.textContent = 'המשך';
    pauseBtn.style.display = 'none';
  }

  function resetTimer() {
    pauseTimer();
    currentPhase = 'ready';
    phaseBadge.textContent = "מוכן להתחלה";
    phaseBadge.className = "phase-badge phase-ready";
    startBtn.textContent = 'התחל אימון';
    startBtn.style.display = 'block';
    pauseBtn.style.display = 'none';
    resetBtn.style.display = 'none';
    initFromConfig();
  }

  function endSession() {
    clearInterval(timerInterval);
    isRunning = false;
    releaseWakeLock();
    phaseBadge.textContent = "הסתיים בהצלחה";
    phaseBadge.className = "phase-badge phase-rest";
    instructionText.textContent = config.endMsg;
    phaseTimer.textContent = "00";
    totalTimer.textContent = "00:00";
    speak(config.endVoice);
    startBtn.style.display = 'none';
    pauseBtn.style.display = 'none';
    resetBtn.style.display = 'block';
  }

  startBtn.addEventListener('click', startTimer);
  pauseBtn.addEventListener('click', pauseTimer);
  resetBtn.addEventListener('click', resetTimer);

  window.addEventListener('popstate', resetTimer);
  window.addEventListener('hashchange', resetTimer);
  initFromConfig();
</script>
</body>
</html>
